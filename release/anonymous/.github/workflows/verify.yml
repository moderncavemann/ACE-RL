name: verify-anonymous-artifact

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.1 matplotlib==3.9.2 pytest==7.4.4
      - name: Verify release integrity and anonymity
        run: python scripts/verify_release.py
      - name: Run current ABIDES unit tests
        run: python -m pytest -q revision/tests
