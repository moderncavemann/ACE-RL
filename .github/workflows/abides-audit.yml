name: ABIDES audit

on:
  push:
    paths:
      - "revision/**"
      - ".github/workflows/abides-audit.yml"
  pull_request:
    paths:
      - "revision/**"
      - ".github/workflows/abides-audit.yml"

permissions:
  contents: read

jobs:
  verify-audit-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.13.1 matplotlib==3.9.2 pytest==7.4.4
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch pinned official MAPPO source
        run: python revision/experiments/setup_official_on_policy.py

      - name: Run revision tests
        run: python -m pytest -q revision/tests

      - name: Recompute and verify the independent audit
        run: python revision/experiments/verify_abides_audit_bundle.py

      - name: Recompute the collusion diagnostic claim boundary
        run: python revision/experiments/verify_abides_collusion_diagnostic.py

      - name: Recompute dose and routing sensitivity
        run: python revision/experiments/verify_abides_dose_routing_sensitivity.py

      - name: Recompute temporary commitment audit
        run: python revision/experiments/verify_abides_temporary_commitment.py

      - name: Recompute learner and ecology holdout audit
        run: python revision/experiments/verify_abides_holdout_audit_bundle.py --bundle-only

      - name: Verify ABCE primary follow-up audit bundle
        run: python revision/experiments/verify_abides_abce_primary_followup_v1.py --artifact revision/paper/artifacts/abides_abce_primary_followup_v1 --bundle-only

      - name: Verify deterministic paper exports
        run: |
          python revision/experiments/export_abides_audit_bundle.py --check
          python revision/experiments/export_abides_collusion_audit_bundle.py --check
          python revision/experiments/export_abides_dose_routing_audit_bundle.py --check
          python revision/experiments/export_abides_temporary_commitment_audit_bundle.py --check
          python revision/experiments/export_abides_holdout_audit_bundle.py --check
